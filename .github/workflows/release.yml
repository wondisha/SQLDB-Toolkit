name: Build and Release SQLDB-Toolkit

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --engine-strict=false

      - name: Build SEA Executable
        run: npm run build:exe

      - name: Assemble Release Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "SQLDB-Toolkit-Release" -Force
          Copy-Item "dist\SQLDB-Toolkit.exe" "SQLDB-Toolkit-Release\"
          Copy-Item "public" "SQLDB-Toolkit-Release\public" -Recurse -Force
          
          if (Test-Path "run.bat") {
            Copy-Item "run.bat" "SQLDB-Toolkit-Release\"
          }

          if (Test-Path "servers.csv") {
            Copy-Item "servers.csv" "SQLDB-Toolkit-Release\"
          } else {
            Set-Content -Path "SQLDB-Toolkit-Release\servers.csv" -Value "id,name,server,database,auth,encrypt`nlocal-dev,Local Instance,localhost,AdventureWorks2025,windows,false"
          }

          if (Test-Path "README.md") {
            Copy-Item "README.md" "SQLDB-Toolkit-Release\README.txt"
          }

          if (Test-Path ".env") {
            Copy-Item ".env" "SQLDB-Toolkit-Release\"
          }

      - name: Compress Release Archive
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          Compress-Archive -Path "SQLDB-Toolkit-Release\*" -DestinationPath "SQLDB-Toolkit-$ver-win-x64.zip"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SQLDB-Toolkit-${{ github.ref_name }}-win-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
